[package]
name = "harness-ports"
version = "0.1.0"
edition = "2021"

[dependencies]
ts-rs = { version = '10', features = ['serde-compat'] }
harness-domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Só para os testes desta crate correrem sozinhos. Num `cargo test --workspace`
# a unificação de features emprestava-lhe o `macros` de outra crate, portanto um
# `cargo test -p harness-ports` falhava a compilar — e os testes que não
# compilam são testes que ninguém corre.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
