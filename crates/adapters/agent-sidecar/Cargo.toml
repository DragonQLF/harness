[package]
name = "harness-agent-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
harness-ports = { path = "../../ports" }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
