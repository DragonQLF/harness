[package]
name = "harness-agent-codex"
version = "0.1.0"
edition = "2021"

[dependencies]
harness-ports = { path = "../../ports" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
