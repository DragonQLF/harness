[package]
name = "harness-app"
version = "0.1.0"
edition = "2021"

[dependencies]
ts-rs = { version = '10', features = ['serde-compat'] }
harness-domain = { path = "../domain" }
harness-ports = { path = "../ports" }
# Only for the model catalogue: Codex names its own models, and the list has
# to become `CatalogModel` somewhere the cargo can test it.
harness-agent-codex = { path = "../adapters/model-codex" }
harness-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "test-util"] }

[target.'cfg(unix)'.dependencies]
# Só para o `kill`/`killpg` do `strays`. Ver o comentário lá.
libc = "0.2"
