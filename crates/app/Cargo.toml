[package]
name = "harness-app"
version = "0.1.0"
edition = "2021"

[dependencies]
ts-rs = { version = '10', features = ['serde-compat'] }
harness-domain = { path = "../domain" }
harness-ports = { path = "../ports" }
harness-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
