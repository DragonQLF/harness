# Publishing a Relay version.
#
# Every install checks one URL — the `latest.json` attached to the newest
# release — and installs only what the updater's key signed. That signature is
# the whole security model: without it the app would download and execute
# whatever answered the request. The private key is never in this repository;
# it lives in the TAURI_SIGNING_PRIVATE_KEY secret and in ~/.relay on the
# machine that generated it.
#
# Cross-device lives here too. A Windows box cannot build a macOS binary, so
# the matrix is what actually lets the same release serve a Mac.
#
# Cutting a release:
#   1. bump `version` in all three places that carry it and must agree:
#      src-tauri/tauri.conf.json, src-tauri/Cargo.toml, package.json
#   2. commit, then tag it:  git tag v0.2.0 && git push origin v0.2.0
# The tag is the trigger; the draft it produces is published by hand, so a bad
# build is never something every install picks up on its own.
#
# Publishing the draft is what makes a version real: the manifest job runs off
# the tag and writes the `updates` branch, but installs only see the assets
# once the release itself is out of draft.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Both Mac architectures from one runner; Intel machines are not
          # served by an arm64-only build.
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      # The sidecar ships as a resource and installs its own dependencies on
      # first run, but its lockfile must resolve for the build to be honest.
      - run: pnpm install --frozen-lockfile
        working-directory: sidecar

      - name: Check before publishing
        run: |
          pnpm exec tsc --noEmit
          cargo test --workspace

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Relay ${{ github.ref_name }}"
          releaseBody: "See the commit log for what changed."
          # Published by hand: an install that self-updates should never pick
          # up a build nobody looked at.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The manifest the installed copies actually read.
  #
  # A private repository answers 404 to an unauthenticated request, so the
  # browser download URLs tauri-action writes into latest.json are unreachable
  # by definition. The API's asset endpoint is not: it serves the bytes to a
  # token that can read the repo. This job rewrites every URL to that form and
  # commits the result to the `updates` branch, which raw.githubusercontent
  # serves to the same token — one Authorization header covers both halves.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the manifest for private access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -p latest.json -D . --clobber
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > release.json
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('latest.json'))
          release = json.load(open('release.json'))
          # asset name -> the API url that serves its bytes to a bearer token
          by_name = {a['name']: a['url'] for a in release['assets']}
          missing = []
          for key, platform in manifest['platforms'].items():
              name = platform['url'].rsplit('/', 1)[-1]
              if name in by_name:
                  platform['url'] = by_name[name]
              else:
                  missing.append((key, name))
          if missing:
              raise SystemExit(f"no asset for {missing}; refusing to publish a manifest that points nowhere")
          json.dump(manifest, open('latest.json', 'w'), indent=2)
          print(f"rewrote {len(manifest['platforms'])} platform urls to the api form")
          PY

      - name: Publish it to the updates branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # An orphan branch: it carries the manifest and nothing else, so the
          # source is never served from a URL meant for one small file.
          git checkout --orphan updates
          git rm -rf --cached . >/dev/null
          find . -maxdepth 1 ! -name . ! -name .git ! -name latest.json -exec rm -rf {} +
          git add latest.json
          git commit -m "manifest for $TAG"
          git push --force origin updates
