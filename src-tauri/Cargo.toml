[package]
name = "harness"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
harness-app = { path = "../crates/app" }
harness-domain = { path = "../crates/domain" }
harness-engine = { path = "../crates/engine" }
harness-ports = { path = "../crates/ports" }
harness-store-jsonl = { path = "../crates/adapters/store-jsonl" }
harness-git-cli = { path = "../crates/adapters/git" }
harness-agent-claude = { path = "../crates/adapters/model-claude" }
harness-agent-sidecar = { path = "../crates/adapters/agent-sidecar" }
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-dialog = "2.7.2"
tokio-util = { version = "0.7.19", features = ["rt"] }

