[package]
name = "relay"
version = "0.3.21"
description = "Relay"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# A pasted attachment crosses the IPC boundary as text. A 20 MB image sent as a
# JSON array of numbers is ~100 MB of wire and a parse to match; base64 is a
# third of the bytes and one allocation on each side.
base64 = "0.22"
harness-app = { path = "../crates/app" }
harness-domain = { path = "../crates/domain" }
harness-engine = { path = "../crates/engine" }
harness-ports = { path = "../crates/ports" }
harness-store-jsonl = { path = "../crates/adapters/store-jsonl" }
harness-git-cli = { path = "../crates/adapters/git" }
harness-agent-claude = { path = "../crates/adapters/model-claude" }
harness-agent-codex = { path = "../crates/adapters/model-codex" }
harness-agent-sidecar = { path = "../crates/adapters/agent-sidecar" }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tauri-plugin-dialog = "2.7.2"
tokio-util = { version = "0.7.19", features = ["rt"] }
# Only for catch_unwind on the close sequence: the window must be released
# even when a shutdown step panics.
futures-util = { version = "0.3", default-features = false }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# The model catalogue is fetched here rather than in the webview: the CSP that
# keeps the window off the network does not exempt a fetch we happen to want.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# No fim, e não a meio de [dependencies]: um cabeçalho de secção rouba tudo o
# que vier depois dele. Só desktop — não há segundo arranque a dobrar no
# primeiro num telemóvel. O `desktop` do Tauri é um alias de Rust, não um alvo
# que o cargo conheça, portanto aqui tem de se dizer por extenso.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
